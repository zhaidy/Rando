# 一起骑的服务端。部署由 GitHub Actions（.github/workflows/server.yml）完成，
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID
name = "rando-group"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 附近的队伍：全局一个大厅
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 免费版只能用 SQLite 存储的 Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
