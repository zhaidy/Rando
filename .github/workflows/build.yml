name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RANDO_KEYSTORE_PASSWORD: ${{ secrets.RANDO_KEYSTORE_PASSWORD }}
      RANDO_KEY_ALIAS: ${{ secrets.RANDO_KEY_ALIAS }}
      RANDO_KEY_PASSWORD: ${{ secrets.RANDO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成更新说明要用到之前的 build-* 标签和提交历史
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # 默认还会装已下架的 "tools" 包而失败；SDK 平台由 Gradle 按需下载
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # 固定签名密钥放在 Secrets 里；没配置时退回调试签名（此时 APK 不能覆盖安装旧版）
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RANDO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rando.keystore"
            echo "RANDO_KEYSTORE_FILE=$RUNNER_TEMP/rando.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::RANDO_KEYSTORE_BASE64 未配置，使用调试签名"
          fi
      - run: chmod +x gradlew && ./gradlew assembleRelease testDebugUnitTest
      - run: mv app/build/outputs/apk/release/app-release.apk rando.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rando-apk
          path: rando.apk
      # 只有 main 上的构建才发 Release
      # 更新说明：上一个 build-* 标签之后 main 上的提交标题
      - name: Release notes
        if: github.ref == 'refs/heads/main' && env.RANDO_KEYSTORE_FILE != ''
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="-1"; fi
          git log $range --no-merges --format='%s' | sed -E 's/ \(#[0-9]+\)$//; s/^/- /' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.RANDO_KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rando build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notes.md
          files: rando.apk
          make_latest: true
